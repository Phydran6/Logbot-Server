# ==============================================================================
# Name:        Phydran6
# Kontakt:     Phydran6
# Changelog:   CHANGELOG/database.md
# Beschreibung: LogBot - Docker Compose Konfiguration
# ==============================================================================
#
# NAMEN: WAS IST HIER EIGENTLICH WESSEN?
#
#   Frueher hiess jeder Container in diesem Stack `logbot-irgendwas` - auch
#   PostgreSQL und Caddy. Das war irrefuehrend: PostgreSQL ist nicht "von
#   LogBot", es ist PostgreSQL. Und daran haengt eine praktische Frage, naemlich
#   *wie* man ein Ding aktualisiert. Deshalb sagen die Namen es jetzt:
#
#     logbot-app-*   Aus DIESEM Quellcode gebaut (backend, frontend, syslog).
#                    Aktualisiert werden sie ueber System -> Updates: neuer
#                    Stand von GitHub, Container neu bauen. Ein Image-Update
#                    gibt es fuer sie nicht - es gibt kein fertiges Image.
#
#     logbot-ext-*   Fremde, fertige Images (postgres, caddy, ...). Die werden
#                    aktualisiert, indem man ein neueres Image holt - genau wie
#                    ueberall sonst auch. Zustaendig dafuer: System -> Container.
#                    LogBots Patchmanagement fasst sie NICHT an.
#
#   Zusaetzlich traegt jeder Dienst Labels (de.logbot.*). Danach richten sich
#   die Container-Uebersicht in der Oberflaeche und der Update-Pruefer
#   (Tugtainer) - der Name allein ist fuer Menschen, die Labels fuer Maschinen.
#
#   Alte Namen bleiben im Docker-Netz als Alias erreichbar. Eine gespeicherte
#   Adresse wie `http://logbot-n8n:5678` funktioniert also weiter.
# ==============================================================================

services:

  # ============================================================================
  # FREMD: PostgreSQL. Nicht von LogBot - ganz normales PostgreSQL.
  # ============================================================================
  postgres:
    # PostgreSQL-Major-Version ueber POSTGRES_VERSION in .env steuerbar.
    # Standard: 17 (neu + stabil). Neuinstallationen bekommen direkt 17-alpine.
    # NOTBREMSE bei bestehender 16er-DB: POSTGRES_VERSION=16 in .env setzen,
    # dann laeuft alles sofort weiter. Datenerhaltendes Upgrade: db/migrate.sh.
    # Details: README -> "Update / PostgreSQL-Major-Upgrade".
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: logbot-ext-postgres
    hostname: postgres
    restart: unless-stopped
    labels:
      de.logbot.stack: "core"
      de.logbot.origin: "upstream"          # fremdes Image
      de.logbot.update: "image"             # Update = neueres Image holen
      de.logbot.component: "postgres"
      de.logbot.role: "Datenbank — hier liegen alle Logs"
      de.logbot.critical: "true"
    environment:
      POSTGRES_USER: ${DB_USER:-logbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-logbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Nur vom Server selbst erreichbar. Vorher war der Port auf allen
      # Schnittstellen offen - die Datenbank hing damit ungeschuetzt im
      # Netz und war nur durch das Passwort getrennt.
      # Zugriff von aussen wirklich noetig? Dann DB_BIND=0.0.0.0 in der .env.
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logbot} -d ${DB_NAME:-logbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      logbot:
        aliases:
          - postgres
          - logbot-postgres                 # alter Name, damit nichts bricht

  # ============================================================================
  # EIGEN: Syslog-Empfaenger. Aus ./syslog gebaut.
  # ============================================================================
  syslog:
    build: ./syslog
    image: logbot/syslog:local
    container_name: logbot-app-syslog
    hostname: syslog
    restart: unless-stopped
    labels:
      de.logbot.stack: "core"
      de.logbot.origin: "logbot"            # aus diesem Quellcode gebaut
      de.logbot.update: "source"            # Update = System -> Updates
      de.logbot.component: "syslog"
      de.logbot.role: "Nimmt Syslog auf Port 514 entgegen (UDP und TCP)"
      de.logbot.critical: "true"
    environment:
      # Bei externer Datenbank DB_HOST in der .env auf den externen Server setzen
      # (oder DATABASE_URL nutzen) - siehe deploy/external-db.yml.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-logbot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-logbot}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      logbot:
        aliases:
          - syslog
          - logbot-syslog

  # ============================================================================
  # EIGEN: Backend (FastAPI). Aus ./backend gebaut.
  # ============================================================================
  backend:
    build: ./backend
    image: logbot/backend:local
    container_name: logbot-app-backend
    hostname: backend
    restart: unless-stopped
    labels:
      de.logbot.stack: "core"
      de.logbot.origin: "logbot"
      de.logbot.update: "source"
      de.logbot.component: "backend"
      de.logbot.role: "API, Oberflaechen-Logik, Patchmanagement, Terminal"
      de.logbot.critical: "true"
    # ACHTUNG, bewusst weitreichende Rechte: privileged + pid:host + SYS_BOOT
    # existieren fuer den Neustart-Knopf, das Terminal, das Patchmanagement und
    # die Container-Verwaltung (der Container steuert damit den *Host*).
    # Preis: wer im Backend Code ausfuehren kann, uebernimmt den ganzen Server.
    # Wer das nicht braucht, faehrt die Rechte herunter mit:
    #   docker compose -f docker-compose.yml -f deploy/hardened.yml up -d
    privileged: true
    pid: "host"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_BOOT
    # DNS wird zur Laufzeit ueber "Einstellungen -> Netzwerk -> DNS" verwaltet
    # (schreibt /etc/resolv.conf im Container). Standard: per DHCP vergebener
    # System-DNS des Hosts; optional eigene Server. Siehe backend routes/network.py.
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-logbot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-logbot}
      # Externe Datenbank: setzt die Einzelwerte oben ausser Kraft.
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      CADDY_CERTS_DIR: ${CADDY_CERTS_DIR:-/caddy-certs}
      # Notausstieg: CADDY_FORCE_HTTP=true in der .env setzen, Backend neu starten
      # -> zurueck auf reines HTTP (Port 80), gespeicherte TLS-Config wird verworfen.
      CADDY_FORCE_HTTP: ${CADDY_FORCE_HTTP:-false}
      SITE_URL: ${SITE_URL:-}
      # Patchmanagement (System -> Updates): wo die Installation auf dem HOST
      # liegt und gegen welches Repository geprueft wird. Das Update selbst
      # laeuft auf dem Host (systemd-run), nicht in diesem Container.
      LOGBOT_INSTALL_DIR: ${LOGBOT_INSTALL_DIR:-/opt/logbot}
      LOGBOT_REPO_SLUG: ${LOGBOT_REPO_SLUG:-Phydran6/Logbot-Server}
      LOGBOT_BRANCH: ${LOGBOT_BRANCH:-main}
      # Optional: hebt das Limit der anonymen GitHub-Abfragen an.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Sofortmeldung bei neuem Stand: Takt des eigenen Beobachters und das
      # Secret fuer den GitHub-Webhook (ohne Secret nimmt der Server keine
      # Webhook-Meldung an). Siehe app/updater.py.
      LOGBOT_UPDATE_WATCH: ${LOGBOT_UPDATE_WATCH:-true}
      LOGBOT_UPDATE_WATCH_INTERVAL: ${LOGBOT_UPDATE_WATCH_INTERVAL:-120}
      LOGBOT_WEBHOOK_SECRET: ${LOGBOT_WEBHOOK_SECRET:-}
      # Sicherungen: Ablageort im Container (haengt am Volume unten) und wie
      # viele aufgehoben werden.
      LOGBOT_BACKUP_DIR: /backups
      LOGBOT_KEEP_BACKUPS: ${LOGBOT_KEEP_BACKUPS:-10}
      # Terminal im Browser (System -> Konsole). Es oeffnet eine Root-Shell auf
      # dem HOST - wie die Konsole in Proxmox VE. Nur Administratoren, jede
      # Sitzung wird protokolliert. Abschalten: LOGBOT_WEBSHELL=false.
      LOGBOT_WEBSHELL: ${LOGBOT_WEBSHELL:-true}
      LOGBOT_WEBSHELL_MAX_SESSIONS: ${LOGBOT_WEBSHELL_MAX_SESSIONS:-3}
      LOGBOT_WEBSHELL_IDLE_TIMEOUT: ${LOGBOT_WEBSHELL_IDLE_TIMEOUT:-900}
      # Plattenwaechter: raeumt auf, BEVOR es eng wird. Siehe app/diskguard.py.
      DISK_MONITOR_INTERVAL: ${DISK_MONITOR_INTERVAL:-60}
      DISK_USAGE_WARN: ${DISK_USAGE_WARN:-80}
      DISK_USAGE_HIGH: ${DISK_USAGE_HIGH:-88}
      DISK_USAGE_THRESHOLD: ${DISK_USAGE_THRESHOLD:-93}
      DISK_USAGE_TARGET: ${DISK_USAGE_TARGET:-75}
      DISK_MIN_KEEP_HOURS: ${DISK_MIN_KEEP_HOURS:-24}
      DISK_ALLOW_TRUNCATE: ${DISK_ALLOW_TRUNCATE:-false}
      # Anmeldung ueber Microsoft 365 / Entra ID (OpenID Connect).
      # Eingerichtet wird das in der Oberflaeche unter Sicherheit -> Single Sign-on.
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      # Sprache der Oberflaeche, wenn ein Browser nichts anderes verlangt.
      LOGBOT_DEFAULT_LANGUAGE: ${LOGBOT_DEFAULT_LANGUAGE:-de}
    expose:
      - "8000"
    volumes:
      - caddy_certs:/caddy-certs
      # Sicherungen liegen in einem eigenen Volume: so ueberstehen sie einen
      # Neubau der Container - und genau dafuer sind sie da.
      - backup_data:/backups
      # Branding-Dateien und die erzeugte Postfix-Konfiguration.
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      logbot:
        aliases:
          - backend
          - logbot-backend

  # ============================================================================
  # EIGEN: Frontend (Vue, ausgeliefert von nginx). Aus ./frontend gebaut.
  # ============================================================================
  frontend:
    build: ./frontend
    image: logbot/frontend:local
    container_name: logbot-app-frontend
    hostname: frontend
    restart: unless-stopped
    labels:
      de.logbot.stack: "core"
      de.logbot.origin: "logbot"
      de.logbot.update: "source"
      de.logbot.component: "frontend"
      de.logbot.role: "Die Weboberflaeche"
      de.logbot.critical: "true"
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      logbot:
        aliases:
          - frontend
          - logbot-frontend

  # ============================================================================
  # FREMD: Caddy. Reverse Proxy und TLS - nicht von LogBot.
  # ============================================================================
  caddy:
    image: caddy:${CADDY_VERSION:-2}-alpine
    container_name: logbot-ext-caddy
    hostname: caddy
    restart: unless-stopped
    labels:
      de.logbot.stack: "core"
      de.logbot.origin: "upstream"
      de.logbot.update: "image"
      de.logbot.component: "caddy"
      de.logbot.role: "Reverse Proxy und TLS-Zertifikate"
      de.logbot.critical: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_certs:/etc/caddy/certs
    depends_on:
      - frontend
      - backend
    networks:
      logbot:
        aliases:
          - caddy
          - logbot-caddy

# HINWEIS zu Zusatzdiensten: In DIESEM Stack laeuft bewusst nichts Fremdes,
# ausser dem, was LogBot zum Laufen braucht (PostgreSQL und Caddy).
# Portainer, Tugtainer, n8n, Open WebUI und Postfix liegen in
# deploy/optional.yml und haengen dort je an einem eigenen Profil -
# eingeschaltet wird bewusst, in der Oberflaeche unter System -> Zusatzdienste
# oder beim Installieren.
#
# Der Grund fuer die Trennung: Portainer und Tugtainer brauchen den
# Docker-Socket, und wer darauf schreiben kann, ist faktisch root auf diesem
# Server. Genau deshalb wurde der frueher hier enthaltene portainer-agent
# entfernt, und deshalb bekommt Tugtainer den Socket nur lesend.
#
#   docker compose -f docker-compose.yml -f deploy/optional.yml \
#     --profile portainer up -d

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_certs:
  backup_data:
  app_data:

networks:
  logbot:
    driver: bridge
