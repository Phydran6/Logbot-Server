# ==============================================================================
# Name:        Phydran6
# Kontakt:     Phydran6
# Version:     2026.07.31.20.06.53
# Beschreibung: LogBot - Docker Compose Konfiguration
# ==============================================================================

services:
  postgres:
    # PostgreSQL-Major-Version ueber POSTGRES_VERSION in .env steuerbar.
    # Standard: 17 (neu + stabil). Neuinstallationen bekommen direkt 17-alpine.
    # NOTBREMSE bei bestehender 16er-DB: POSTGRES_VERSION=16 in .env setzen,
    # dann laeuft alles sofort weiter. Datenerhaltendes Upgrade: db/migrate.sh.
    # Details: README -> "Update / PostgreSQL-Major-Upgrade".
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: logbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-logbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-logbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logbot} -d ${DB_NAME:-logbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - logbot

  syslog:
    build: ./syslog
    container_name: logbot-syslog
    restart: unless-stopped
    environment:
      # Bei externer Datenbank DB_HOST in der .env auf den externen Server setzen
      # (oder DATABASE_URL nutzen) - siehe docker-compose.external-db.yml.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-logbot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-logbot}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logbot

  backend:
    build: ./backend
    container_name: logbot-backend
    restart: unless-stopped
    privileged: true
    pid: "host"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_BOOT
    # DNS wird zur Laufzeit ueber "Einstellungen -> Netzwerk -> DNS" verwaltet
    # (schreibt /etc/resolv.conf im Container). Standard: per DHCP vergebener
    # System-DNS des Hosts; optional eigene Server. Siehe backend routes/network.py.
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-logbot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-logbot}
      # Externe Datenbank: setzt die Einzelwerte oben ausser Kraft.
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      CADDY_CERTS_DIR: ${CADDY_CERTS_DIR:-/caddy-certs}
      # Notausstieg: CADDY_FORCE_HTTP=true in der .env setzen, Backend neu starten
      # -> zurueck auf reines HTTP (Port 80), gespeicherte TLS-Config wird verworfen.
      CADDY_FORCE_HTTP: ${CADDY_FORCE_HTTP:-false}
      SITE_URL: ${SITE_URL:-}
    expose:
      - "8000"
    volumes:
      - caddy_certs:/caddy-certs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logbot

  frontend:
    build: ./frontend
    container_name: logbot-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - logbot

  caddy:
    image: caddy:2-alpine
    container_name: logbot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_certs:/etc/caddy/certs
    depends_on:
      - frontend
      - backend
    networks:
      - logbot

# HINWEIS: Bewusst KEINE Fremd-/Management-Systeme (z. B. Portainer-Agent) in
# diesem Stack. LogBot bleibt eigenstaendig; Verwaltungswerkzeuge werden – falls
# gewuenscht – getrennt vom Nutzer betrieben. Der frueher hier enthaltene
# portainer-agent (Port 9001, mountete /var/run/docker.sock) wurde entfernt:
# der Docker-Socket im Stack ist faktisch Root-Zugriff auf den Host.

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_certs:

networks:
  logbot:
    driver: bridge
