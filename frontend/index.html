<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- Kein user-scalable=no mehr: gesperrtes Zoomen schliesst alle aus, die
       vergroessern muessen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16161f">
  <meta name="color-scheme" content="dark light">
  <title>LogBot</title>
  <style>
    /* Hintergrund schon vor dem Laden des Bundles setzen, sonst blitzt beim
       Start kurz Weiss auf. Werte = --dark-bg / --light-bg aus main.css. */
    html { background-color: #16161f; }
    html[data-theme="light"] { background-color: #f4f6fa; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
