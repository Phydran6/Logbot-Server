server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache + compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject application/x-font-ttf application/xhtml+xml application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
