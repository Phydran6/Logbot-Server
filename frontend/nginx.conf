# WebSocket-Upgrade nur durchreichen, wenn der Browser es auch verlangt.
# Ein fest gesetztes "Connection: upgrade" wuerde jede gewoehnliche Anfrage
# stoeren.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Schutzschicht gegen eingeschleusten Code (XSS): Skripte nur von hier,
    # keine fremden Rahmen, keine Formulare nach draussen. Logzeilen kommen
    # von Geraeten im Netz - also von Dritten; die Oberflaeche zeigt sie als
    # Text an, diese Kopfzeile ist die zweite Sicherung dahinter.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Static assets: long cache + compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject application/x-font-ttf application/xhtml+xml application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in einem location-Block ersetzt die des server-Blocks.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Ersatzweg zur API. Im Regelbetrieb geht /api direkt ueber Caddy - dieser
    # Block greift nur, wenn jemand den Frontend-Container unmittelbar
    # anspricht. Er muss trotzdem alles koennen, was die Oberflaeche braucht:
    #
    #   Upgrade/Connection  fuer die Konsole (WebSocket). Ohne diese beiden
    #                       Kopfzeilen bleibt die Verbindung ein gewoehnliches
    #                       HTTP und die Shell kommt nie zustande.
    #   proxy_buffering off fuer die Ereignisstroeme (Server-Sent Events):
    #                       Update-Ausgabe und Systemtagebuch laufen live mit.
    #                       Mit Pufferung kaeme alles erst am Ende auf einmal.
    #   read_timeout        ein Ereignisstrom ist lange still; die Vorgabe von
    #                       60 s wuerde ihn im Minutentakt kappen.
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
